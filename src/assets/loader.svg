<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="sketchy" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <!-- Background Splashes -->
  <rect x="40" y="120" width="120" height="40" fill="#F9B8AF" opacity="0.4" filter="url(#sketchy)"/>
  <!-- Wobbly Ink Lines -->
  <g filter="url(#sketchy)" stroke="#00408C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="130" width="100" height="30" rx="10" /><path d="M 150 145 L 180 145 L 180 120 M 180 120 L 170 110 M 180 120 L 190 110 M 70 130 L 70 90 L 130 90 L 130 130" /><circle cx="70" cy="145" r="10" /><circle cx="100" cy="145" r="10" /><circle cx="130" cy="145" r="10" />
  </g>
</svg>