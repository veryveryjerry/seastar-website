<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="sketchy" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <!-- Background Splashes -->
  <circle cx="100" cy="150" r="15" fill="#E85234" opacity="0.4" filter="url(#sketchy)"/>
  <!-- Wobbly Ink Lines -->
  <g filter="url(#sketchy)" stroke="#00408C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 70 70 Q 100 20 130 70 T 100 120 M 100 120 L 100 130" /><circle cx="100" cy="150" r="5" />
  </g>
</svg>